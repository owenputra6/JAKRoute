services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - forum_state:/app/runtime
    restart: unless-stopped
    # If Ollama runs on your host, set OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  forum_state:
